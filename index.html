<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passeggiate Romane - Aldo Fabrizi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* === CONFIGURAZIONE PALETTE E TEMI ALTERNATIVI === */
        :root {
            --bg-main: #1a1816;         /* Antracite caldo (Pellicola) */
            --bg-card: #262320;         /* Sfondo blocchi interno */
            --bg-sidebar: #131110;      /* Sidebar scura fissa */
            --text-main: #fcfaf2;       /* Bianco Avorio vintage */
            --text-muted: #a8a29e;      /* Grigio di supporto */
            --accent-sunset: #e67e22;   /* Arancio tramonto romano */
            --accent-brick: #b03a2e;    /* Rosso Cinema / Mattone */
            --accent-gold: #f1c40f;     /* Giallo Zafferano / Mosaici */
            --border-color: #3a3530;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        .light-theme {
            --bg-main: #f5f2eb;         /* Carta antica ingiallita */
            --bg-card: #eadecd;         /* Pergamena chiara */
            --bg-sidebar: #dfd5c6;      /* Sidebar seppia */
            --text-main: #2c2520;       /* Inchiostro scuro */
            --text-muted: #6e6458;
            --accent-sunset: #d35400;   /* Arancio bruciato */
            --accent-brick: #922b21;    /* Rosso granata */
            --accent-gold: #d4ac0d;
            --border-color: #cdbfb0;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        /* === REGOLE BASE E TRANSIZIONI SCHERMATA === */
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.4s ease, color 0.4s ease; }
        body { font-family: 'Georgia', serif; background: var(--bg-main); color: var(--text-main); overflow-x: hidden; }

        .view { display: none; opacity: 0; transform: translateY(15px); transition: opacity 0.5s ease, transform 0.5s ease; }
        .view.active { display: block; opacity: 1; transform: translateY(0); }

        /* === NAVIGATION BAR CON LOGO CINEMA === */
        #navbar {
            background: linear-gradient(to right, #0a0a0a, var(--accent-brick));
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent-gold);
            box-shadow: 0 4px 15px var(--shadow);
            position: sticky; top: 0; z-index: 1000;
        }

        .nav-logo { display: flex; align-items: center; gap: 12px; }
        .nav-logo span { font-size: 1.8em; }
        #dynamic-title { font-size: 1.4em; text-transform: uppercase; letter-spacing: 2px; color: var(--text-main); font-weight: bold; }
        
        .nav-controls { display: flex; gap: 15px; align-items: center; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .nav-btn:hover { background: var(--accent-sunset); border-color: var(--accent-gold); }

        /* === HOME VIEW: COPERTINA GRANDE IMPATTO === */
        #home-view { padding: 40px; max-width: 1400px; margin: 0 auto; }
        
        .hero-container {
            display: flex; flex-direction: column; background: var(--bg-card);
            border-radius: 16px; overflow: hidden; box-shadow: 0 15px 40px var(--shadow);
            border: 2px solid var(--border-color);
        }

        .hero-banner {
            width: 100%; height: 550px; background-size: cover; background-position: center;
            position: relative; border-bottom: 5px solid var(--accent-sunset);
        }

        .hero-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 20%, rgba(0,0,0,0));
            padding: 40px; color: #fcfaf2;
        }
        .hero-overlay h2 { font-size: 3.5em; color: var(--accent-gold); text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .hero-overlay p { font-size: 1.5em; font-style: italic; opacity: 0.9; margin-top: 5px; }

        .hero-details { padding: 40px; display: flex; gap: 40px; }
        .bio-section { flex: 1.4; display: flex; flex-direction: column; justify-content: space-between; }
        .bio-section h3 { color: var(--accent-sunset); font-size: 1.8em; margin-bottom: 15px; }
        .bio-section p { font-size: 1.2em; line-height: 1.7; }

        /* Icone a forma di Pellicola per le opere */
        .opere-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .opera-item {
            background: #111; color: #fff; padding: 12px 20px; border-radius: 4px;
            border-top: 4px dashed #333; border-bottom: 4px dashed #333; /* Effetto perforazione pellicola */
            display: flex; align-items: center; gap: 10px; font-family: monospace; font-size: 1.1em;
        }

        /* Dati Statistici */
        .stats-sidebar { flex: 0.6; background: rgba(0,0,0,0.15); padding: 30px; border-radius: 12px; display: flex; flex-direction: column; gap: 20px; justify-content: center; }
        .stat-card { display: flex; align-items: center; gap: 20px; background: var(--bg-main); padding: 15px; border-radius: 10px; border-left: 5px solid var(--accent-brick); }
        .stat-card .icon { font-size: 2.2em; }
        .stat-card .val { font-size: 1.8em; font-weight: bold; color: var(--accent-gold); display: block; }

        /* === ITINERARY VIEW LAYOUT === */
        #itinerary-view { display: flex; height: calc(100vh - 69px); }
        
        /* Sidebar Fissa a Sinistra */
        #sidebar-timeline {
            width: 360px; background: var(--bg-sidebar); padding: 25px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            border-right: 2px solid var(--border-color); flex-shrink: 0;
        }

        .timeline-step {
            padding: 20px; background: var(--bg-card); border-radius: 10px;
            cursor: pointer; border: 1px solid var(--border-color);
            position: relative; transition: all 0.3s ease; display: flex; align-items: center; gap: 15px;
        }
        .timeline-step .step-ico { font-size: 1.4em; opacity: 0.4; }
        .timeline-step.active {
            background: var(--bg-main); border-color: var(--accent-sunset);
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.2); transform: scale(1.02);
        }
        .timeline-step.active .step-ico { opacity: 1; filter: drop-shadow(0 0 5px var(--accent-gold)); }

        /* Contenuto Principale (Mappa sopra, Dettagli sotto) */
        #main-workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #map { flex: 1.1; min-height: 350px; width: 100%; border-bottom: 3px solid var(--accent-brick); }
        #details-panel { flex: 0.9; background: var(--bg-main); padding: 35px; overflow-y: auto; }

        /* === ELEMENTI DETTAGLIO TAPPA AD EFFETTO === */
        .tappa-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .tappa-title-box h2 { font-size: 2.5em; color: var(--accent-sunset); }
        .tappa-badge-box { text-align: right; }
        .tappa-badge-box .ora { font-size: 1.6em; font-weight: bold; color: var(--accent-gold); }

        /* Frammento di Copione Cinematografico */
        .script-fragment {
            font-family: 'Courier New', Courier, monospace; background: #fbf9f3; color: #1a1a1a;
            padding: 30px; border-left: 8px solid #7f8c8d; margin: 25px 0; box-shadow: 5px 5px 15px rgba(0,0,0,0.15);
            border-radius: 4px; line-height: 1.5;
        }
        .script-character { text-align: center; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; color: #2c3e50; }
        .script-text { padding: 0 15%; text-align: justify; font-size: 1.1em; }
        .script-meta { text-align: right; font-size: 0.85em; color: #7f8c8d; margin-top: 15px; text-transform: uppercase; }

        /* Player Audio Standard */
        .audio-box { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin: 25px 0; }
        .audio-box h4 { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; color: var(--accent-gold); }
        audio { width: 100%; margin-top: 10px; }

        /* Griglia Atmosfera con Effetto Comparsa */
        .atmosphere-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 25px 0; }
        .atm-card { background: var(--bg-card); padding: 20px; border-radius: 10px; border-bottom: 3px solid var(--accent-brick); }
        .atm-card strong { color: var(--accent-sunset); display: block; margin-bottom: 8px; font-size: 1.1em; }
        
        .sound-line { opacity: 0; transform: translateX(-10px); animation: slideInSound 0.5s forwards; margin-bottom: 5px; }
        @keyframes slideInSound { to { opacity: 1; transform: translateX(0); } }

        .photo-tip { background: rgba(241, 196, 15, 0.08); border: 1px dashed var(--accent-gold); padding: 20px; border-radius: 8px; margin-top: 25px; }

        /* === SCHERMATA INFO UTILI (OPZIONE B) === */
        #info-view { padding: 50px; max-width: 1000px; margin: 0 auto; }
        #info-view h2 { font-size: 2.5em; color: var(--accent-gold); margin-bottom: 30px; text-align: center; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .info-box { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
        .info-box h3 { color: var(--accent-sunset); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .info-box ul { list-style-position: inside; line-height: 1.8; }

        /* === ANIMAZIONI MAPPA MAPPA === */
        @keyframes dashflow { to { stroke-dashoffset: -30; } }
        .animated-route { animation: dashflow 1.5s linear infinite; }
        .custom-cinema-marker { font-size: 24px; text-align: center; line-height: 1; filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.5)); }
    </style>
</head>
<body>

    <div id="navbar">
        <div class="nav-logo">
            <span>🎥</span>
            <div id="dynamic-title">Roma di Fabrizi</div>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="switchView('home')">Home</button>
            <button class="nav-btn" onclick="switchView('info')">🧳 Info Utili</button>
            <button class="nav-btn" onclick="toggleTheme()">🌓 Tema</button>
        </div>
    </div>

    <div id="home-view" class="view active">
        <div id="home-dynamic-container"></div>
    </div>

    <div id="itinerary-view" class="view">
        <div id="sidebar-timeline"></div>
        <div id="main-workspace">
            <div id="map"></div>
            <div id="details-panel">
                <div id="dynamic-tappa-content"></div>
                <div style="display: flex; gap: 20px; margin-top: 30px;">
                    <button class="nav-btn" onclick="changeTappa(-1)" style="flex:1; padding: 15px;">← Tappa Precedente</button>
                    <button class="nav-btn" onclick="changeTappa(1)" style="flex:1; padding: 15px; background: var(--accent-brick);">Prossima Tappa →</button>
                </div>
            </div>
        </div>
    </div>

    <div id="info-view" class="view">
        <h2>Guida Pratica alla Passeggiata</h2>
        <div id="info-dynamic-container" class="info-grid"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let appData = null;
        let activeItinerario = null;
        let activeTappaIdx = 0;
        let mapObj = null;
        let mapMarkers = [];
        let routePath = null;

        // Inizializzazione applicazione
        async function startApp() {
            try {
                const response = await fetch('data.json');
                appData = await response.json();
                buildHomeView();
                buildInfoView();
            } catch (err) {
                console.error("Errore nel caricamento del file data.json: ", err);
            }
        }

        // Cambio Schermata con effetto transizione
        function switchView(viewId) {
            const current = document.querySelector('.view.active');
            if (current) {
                current.classList.remove('active');
            }
            const target = document.getElementById(`${viewId}-view`);
            target.classList.add('active');

            // Gestione titolo dinamico della Navbar
            const titleElement = document.getElementById('dynamic-title');
            if (viewId === 'itinerary' && activeItinerario) {
                titleElement.textContent = activeItinerario.tappe[activeTappaIdx].nome;
            } else {
                titleElement.textContent = "Roma di Fabrizi";
            }
        }

        // Cambio Tema (Dark / Light)
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        // Costruzione Home Page con l'immagine di Ponte Sisto come Cover grande
        function buildHomeView() {
            const container = document.getElementById('home-dynamic-container');
            container.innerHTML = '';

            activeItinerario = appData.itinerari[0]; // Carica il primo itinerario

            // Cerchiamo la foto di Ponte Sisto nell'ultima tappa per usarla come copertina principale della Home
            const fotoPonteSisto = activeItinerario.tappe[activeItinerario.tappe.length - 1].immagine_copertina || activeItinerario.personaggio.immagine;

            const hero = document.createElement('div');
            hero.className = 'hero-container';
            hero.innerHTML = `
                <div class="hero-banner" style="background-image: url('${fotoPonteSisto}')">
                    <div class="hero-overlay">
                        <p>${activeItinerario.tema}</p>
                        <h2>${activeItinerario.nome}</h2>
                    </div>
                </div>
                <div class="hero-details">
                    <div class="bio-section">
                        <div>
                            <h3>${activeItinerario.personaggio.nome} (${activeItinerario.personaggio.anni})</h3>
                            <p>${activeItinerario.personaggio.biografia_breve}</p>
                        </div>
                        <div>
                            <h4 style="margin-top:25px; color: var(--accent-gold);">Filmografia Principale:</h4>
                            <div class="opere-grid">
                                ${activeItinerario.personaggio.opere_correlate.map(op => `
                                    <div class="opera-item">🎞️ <span>${op}</span></div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="stats-sidebar">
                        <div class="stat-card">
                            <div class="icon">⏱️</div>
                            <div><span class="val">${activeItinerario.durata_totale_ore} Ore</span><small>Tempo Stimato</small></div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">👣</div>
                            <div><span class="val">${activeItinerario.distanza_totale_km} Km</span><small>Spazio Totale</small></div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">📍</div>
                            <div><span class="val">${activeItinerario.tappe.length}</span><small>Tappe Totali</small></div>
                        </div>
                        <button class="nav-btn" onclick="launchItinerary()" style="padding: 18px; font-size: 1.2em; background: var(--accent-brick);">APRI ITINERARIO</button>
                    </div>
                </div>
            `;
            container.appendChild(hero);
        }

        // Costruzione Terza Schermata Info Utili (Opzione B)
        function buildInfoView() {
            const container = document.getElementById('info-dynamic-container');
            container.innerHTML = `
                <div class="info-box">
                    <h3>💡 Consigli Pratici</h3>
                    <ul>${activeItinerario.consigli_pratici.map(c => `<li>${c}</li>`).join('')}</ul>
                </div>
                <div class="info-box">
                    <h3>🗓️ Periodo Consigliato</h3>
                    <p><strong>Miglior periodo:</strong> ${activeItinerario.migliore_periodo_anno}</p>
                    <p style="margin-top: 15px; color: var(--accent-brick);"><strong>Sconsigliato:</strong> ${activeItinerario.sconsigliato.join(', ')}</p>
                </div>
                <div class="info-box">
                    <h3>🎒 Cosa Portare</h3>
                    <ul>${activeItinerario.cosa_portare.map(cp => `<li>${cp}</li>`).join('')}</ul>
                </div>
            `;
        }

        // Avvio dell'itinerario e creazione mappa dettagliata
        function launchItinerary() {
            switchView('itinerary');
            setTimeout(() => {
                if (!mapObj) {
                    // Mappa dettagliata con zoom elevato
                    mapObj = L.map('map', { maxZoom: 19 }).setView([41.890, 12.470], 15);
                    // Layer mappa chiaro ultra dettagliato
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        attribution: 'OpenStreetMap contributors'
                    }).addTo(mapObj);
                }
                setupMapAndSidebar();
            }, 200);
        }

        function setupMapAndSidebar() {
            const sidebar = document.getElementById('sidebar-timeline');
            sidebar.innerHTML = '';

            // Ripulisce eventuali elementi precedenti sulla mappa
            mapMarkers.forEach(m => mapObj.removeLayer(m));
            mapMarkers = [];
            if (routePath) mapObj.removeLayer(routePath);

            const coordinates = activeItinerario.tappe.map(t => t.coordinate);
            
            // Creazione Linea Percorso Animata (Stile Cinema)
            routePath = L.polyline(coordinates, {
                color: 'var(--accent-brick)',
                weight: 6,
                dashArray: '15, 15',
                className: 'animated-route'
            }).addTo(mapObj);

            mapObj.fitBounds(routePath.getBounds(), { padding: [40, 40] });

            activeItinerario.tappe.forEach((t, idx) => {
                // Creazione marker personalizzato a forma di Ciak / Cinepresa
                const iconHtml = L.divIcon({
                    html: `<div class="custom-cinema-marker">🎬<sub style="font-size:11px; font-weight:bold; color:black; background:white; padding:1px 3px; border-radius:50%;">${t.numero}</sub></div>`,
                    className: 'dummy-class',
                    iconSize: [35, 35],
                    iconAnchor: [17, 17]
                });

                const marker = L.marker(t.coordinate, { icon: iconHtml }).addTo(mapObj).bindPopup(`<b>${t.nome}</b>`);
                marker.on('click', () => loadTappa(idx));
                mapMarkers.push(marker);

                // Elemento Timeline Sidebar Sinistra Fissa
                const stepElement = document.createElement('div');
                stepElement.className = `timeline-step ts-${idx}`;
                stepElement.innerHTML = `
                    <div class="step-ico">🎥</div>
                    <div>
                        <strong>${t.numero}. ${t.nome}</strong><br>
                        <small style="color: var(--text-muted);">${t.orario_consigliato}</small>
                    </div>
                `;
                stepElement.onclick = () => loadTappa(idx);
                sidebar.appendChild(stepElement);
            });

            loadTappa(0);
        }

        // Caricamento Tappa con elementi disposti sotto la mappa
        function loadTappa(idx) {
            activeTappaIdx = idx;
            const tappa = activeItinerario.tappe[idx];
            const cult = tappa.esperienza_culturale;

            // Aggiorna titolo dinamico navbar
            document.getElementById('dynamic-title').textContent = tappa.nome;

            // Evidenzia elemento attivo in sidebar
            document.querySelectorAll('.timeline-step').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });

            const container = document.getElementById('dynamic-tappa-content');
            container.innerHTML = `
                <div class="tappa-header">
                    <div class="tappa-title-box">
                        <h2>${tappa.numero}. ${tappa.nome}</h2>
                        <p style="font-size:1.1em; color: var(--text-muted); font-style: italic; margin-top:5px;">${tappa.categoria || ''}</p>
                    </div>
                    <div class="tappa-badge-box">
                        <div class="ora">⏳ ${tappa.orario_consigliato}</div>
                        <div style="text-transform: uppercase; font-size:0.9em; letter-spacing:1px; color: var(--accent-sunset);">${tappa.momento_giornata}</div>
                    </div>
                </div>

                <p style="font-size: 1.2em; line-height: 1.7; margin-bottom: 25px;">${tappa.descrizione_breve}</p>

                <div class="script-fragment">
                    <div class="script-character">${cult.letteratura.autore}</div>
                    <div class="script-text">"${cult.letteratura.citazione}"</div>
                    <div class="script-meta">${cult.letteratura.opera} (${cult.letteratura.anno})</div>
                </div>

                <div class="audio-box">
                    <h4>🎵 Colonna Sonora: <span>${cult.musica.brano_completo}</span></h4>
                    <p style="font-size:0.95em; margin-bottom: 15px; color: var(--text-muted);">${cult.musica.descrizione_musicale}</p>
                    <audio controls src="audio/${tappa.poi_id}.mp3"></audio>
                </div>

                <div class="atmosphere-grid">
                    <div class="atm-card">
                        <strong>💡 Luce e Scenario</strong>
                        <p>${cult.atmosfera.luce}</p>
                    </div>
                    <div class="atm-card">
                        <strong>🌡️ Dettagli Ambientali</strong>
                        <p>Temperatura: ${cult.atmosfera.temperatura_stimata} | Affollamento: ${cult.atmosfera.affollamento}</p>
                    </div>
                    <div class="atm-card" style="grid-column: span 2;">
                        <strong>🔊 Suoni dell'Ambiente</strong>
                        <div id="sounds-container"></div>
                    </div>
                </div>

                <div class="photo-tip">
                    <strong style="color: var(--accent-gold); font-size:1.2em;">📸 Consiglio dell'Esperto Fotografo:</strong>
                    <p style="margin-top:8px; font-style:italic; line-height:1.5;">${cult.atmosfera.consiglio_fotografico}</p>
                </div>
            `;

            // Animazione controllata di comparsa sequenziale per i suoni ambiente
            const soundsContainer = document.getElementById('sounds-container');
            cult.atmosfera.suoni_ambiente.forEach((suono, i) => {
                const p = document.createElement('p');
                p.className = 'sound-line';
                p.style.animationDelay = `${i * 0.2}s`;
                p.innerHTML = `• <i>${suono}</i>`;
                soundsContainer.appendChild(p);
            });

            // Sposta la mappa sulla tappa corrente
            mapObj.setView(tappa.coordinate, 16);
            mapMarkers[idx].openPopup();
        }

        // Navigazione Tappe (Precedente / Successiva)
        function changeTappa(direction) {
            let nextIdx = activeTappaIdx + direction;
            if (nextIdx >= 0 && nextIdx < activeItinerario.tappe.length) {
                loadTappa(nextIdx);
            }
        }

        window.onload = startApp;
    </script>
</body>
</html>
